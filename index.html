<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search and browse submitted army lists for Brighton 40k Teams II." />
    <title>Brighton 40k Teams II — Army Lists</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <h1>Brighton 40k Teams II army lists</h1>
        <p><span id="hero-count">29</span> submitted lists from 40 players. Grouped by team.</p>
        <a id="event-link" href="#">View the event on Best Coast Pairings</a>
      </div>
    </header>

    <main>
      <section class="toolbar" aria-label="List filters">
        <label class="search">
          <span class="sr-only">Search lists</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
          <input id="search" type="search" placeholder="Search player, team, faction or roster…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="filters">
          <label>
            <span>Team</span>
            <select id="team-filter"><option value="">All teams</option></select>
          </label>
          <label>
            <span>Faction</span>
            <select id="faction-filter"><option value="">All factions</option></select>
          </label>
          <button id="clear-filters" type="button">Clear</button>
        </div>
      </section>

      <section class="results-head" aria-live="polite">
        <p><strong id="result-count">29</strong> lists</p>
        <button id="expand-all" type="button">Expand all</button>
      </section>

      <section id="list-grid" class="list-grid"></section>
      <div id="empty-state" class="empty-state" hidden>
        <p>No lists match those filters.</p>
        <button type="button">Reset search</button>
      </div>
    </main>

    <footer>
      <p>Unofficial event reference. List ownership remains with the players who submitted them.</p>
      <p>Source: <a id="footer-event-link" href="#">Best Coast Pairings</a></p>
    </footer>

    <template id="list-template">
      <article class="list-card">
        <button class="list-card__summary" type="button" aria-expanded="false">
          <span class="list-card__number"></span>
          <span class="list-card__identity">
            <strong class="list-card__player"></strong>
          </span>
          <span class="list-card__faction"></span>
          <span class="list-card__toggle" aria-hidden="true"></span>
        </button>
        <div class="list-card__body" hidden>
          <div class="list-card__actions">
            <a class="page-link">View full list →</a>
            <button class="copy-list" type="button">Copy list</button>
            <a class="source-link" target="_blank" rel="noreferrer">Open original ↗</a>
          </div>
          <pre class="list-card__content"></pre>
        </div>
      </article>
    </template>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
